[package]
name = "sound-pad"
version = "2.3.0"
description = "Sound Pad - 音声ファイルランチャー"
authors = ["msdsh"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sound_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decoding only, for music analysis (playback is handled by otoiro).
rodio = { version = "0.21", default-features = false, features = ["symphonia-all"] }
# Playback engine (decode, output, waveform, scrubbing). Pinned to a commit of msdshsk/otoiro.
tauri-plugin-otoiro = { git = "https://github.com/msdshsk/otoiro", rev = "7861f66bc25a8179789974f4e10f8aed2492035b" }
walkdir = "2"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "vorbis", "aac", "isomp4"] }
realfft = "3.5"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-native"] }
ureq = "3.4"

# Audio decoding and resampling are far too slow unoptimised; keep dependencies fast in dev
# builds (the app's own code still builds in debug).
[profile.dev.package."*"]
opt-level = 3

